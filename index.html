<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0812" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="LULLABYTE — a pastel horror tamagotchi. It loves you. It remembers everything." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>LULLABYTE ララバイト</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body {
        background: #060409;
        overflow: hidden;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; position: fixed; inset: 0; }
      #splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #ff8fb8; font-family: ui-rounded, system-ui, sans-serif; font-weight: 800;
        font-size: 20px; letter-spacing: 2px; pointer-events: none;
        transition: opacity 0.6s;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-Dk8Azjc1.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="splash">♡ warming up…</div>
    <script>
      addEventListener("load", () => {
        setTimeout(() => {
          const s = document.getElementById("splash");
          if (s) { s.style.opacity = "0"; setTimeout(() => s.remove(), 700); }
        }, 250);
      });
    </script>
  </body>
</html>
